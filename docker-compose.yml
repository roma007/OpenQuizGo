services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: openquizgo
      POSTGRES_PASSWORD: openquizgo
      POSTGRES_DB: openquizgo
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openquizgo -d openquizgo"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    command: ["sh", "-c", "/app/migrate up && /app/api"]
    environment:
      APP_ENV: dev
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://openquizgo:openquizgo@postgres:5432/openquizgo?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      LOG_LEVEL: info
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: .
    command: ["sh", "-c", "/app/migrate up && /app/worker"]
    environment:
      APP_ENV: dev
      DATABASE_URL: postgres://openquizgo:openquizgo@postgres:5432/openquizgo?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      LOG_LEVEL: info
      REPORT_INTERVAL: 1h
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
