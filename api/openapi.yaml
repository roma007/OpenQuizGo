  /v1/admin/audit:
    get:
      tags: [admin]
      summary: 题目审计日志
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: target_id, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 50 } }
      responses:
        "200": { description: OK }
  /v1/admin/coverage:
