    get:
      tags: [topic]
      summary: 专题详情
      security: [{ AdminAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TopicPack" }
        "404": { description: 专题不存在 }
    put:
      tags: [topic]
      summary: 更新专题
      security: [{ AdminAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TopicPackInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TopicPack" }
        "404": { description: 专题不存在 }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [topic]
      summary: 删除专题
      security: [{ AdminAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
        "404": { description: 专题不存在 }
  /v1/admin/topics/{id}/questions:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      tags: [topic]
      summary: 设置专题题目（覆盖式，最多 500 题）
      security: [{ AdminAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                question_ids:
                  type: array
                  maxItems: 500
                  items: { type: string, format: uuid }
      responses:
        "200":
          description: 更新后的专题
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TopicPack" }
        "404": { description: 专题不存在 }
        "422": { $ref: "#/components/responses/ValidationError" }

  /v1/admin/membership/plans:
    get:
      tags: [membership]
      summary: 会员套餐列表（含草稿/下线）
      security: [{ AdminAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/MembershipPlan" }
    post:
      tags: [membership]
      summary: 创建会员套餐
      security: [{ AdminAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MembershipPlanInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MembershipPlan" }
        "409": { description: 套餐编码已存在 }
        "422": { $ref: "#/components/responses/ValidationError" }
  /v1/admin/membership/plans/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      tags: [membership]
      summary: 更新会员套餐
      security: [{ AdminAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MembershipPlanInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MembershipPlan" }
        "404": { description: 套餐不存在 }
        "409": { description: 套餐编码已存在 }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [membership]
      summary: 删除会员套餐
      security: [{ AdminAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
        "404": { description: 套餐不存在 }
        "409": { description: 套餐已有订单引用，请改为下线 }
  /v1/admin/membership/orders:
    get:
      tags: [membership]
      summary: 全部会员订单
      security: [{ AdminAuth: [] }]
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [pending, paid, cancelled, refunded] } }
        - { name: limit, in: query, schema: { type: integer, default: 20, maximum: 100 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/MembershipOrder" }
                  total: { type: integer }
  /v1/admin/membership/orders/{id}/refund:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [membership]
      summary: 订单退款
      description: 仅已支付订单可退款，按订单时长回退会员到期时间并写审计日志。
      security: [{ AdminAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, maxLength: 200 }
      responses:
        "200":
          description: 退款后的订单
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MembershipOrder" }
        "404": { description: 订单不存在 }
        "409": { description: 订单状态不可退款 }
        "422": { $ref: "#/components/responses/ValidationError" }

  /v1/admin/media:
    post:
      tags: [media]
      summary: 上传题目图片
      security: [{ AdminAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: 上传成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  url: { type: string }
                  bytes: { type: integer }
                  content_type: { type: string }
        "413": { description: 文件过大 }
        "422": { description: 非图片或缺少文件 }

  /v1/media/{name}:
    get:
      tags: [media]
      summary: 读取题目图片
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: 图片
          content:
            image/png: { schema: { type: string, format: binary } }
            image/jpeg: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
            image/gif: { schema: { type: string, format: binary } }
        "404": { description: 文件不存在 }

  /v1/admin/dashboard:
    get:
      tags: [dashboard]
      summary: 运营概览
      security: [{ AdminAuth: [] }]
      parameters:
        - name: days
          in: query
          description: 趋势天数，仅支持 7/30/90
          schema: { type: integer, enum: [7, 30, 90], default: 7 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DashboardOverview" }
        "422": { description: days 不在 7/30/90 内 }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT or opaque device token
    ParentAuth:
      type: http
      scheme: bearer
      bearerFormat: parent JWT
    AdminAuth:
      type: http
      scheme: bearer
      bearerFormat: admin JWT
  parameters:
    ChildID:
      name: childID
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    Unauthorized:
      description: 令牌无效或已过期
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: 无权限
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ValidationError:
      description: 参数校验失败
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    RateLimited:
      description: 限流
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Error:
      type: object
      properties:
        code: { type: string }
        message: { type: string }
        request_id: { type: string }
    Account:
      type: object
      properties:
        id: { type: string, format: uuid }
        family_id: { type: string, format: uuid }
        phone: { type: string }
        role: { type: string, enum: [owner, member] }
    ChildInput:
      type: object
      required: [nickname, stage]
      properties:
        nickname: { type: string }
        birth_year: { type: integer }
        birth_month: { type: integer }
        stage: { type: string, enum: [preschool, low, mid, high] }
        grade_tag: { type: string, example: g2 }
        avatar_url: { type: string }
    Child:
      allOf:
        - $ref: "#/components/schemas/ChildInput"
        - type: object
          properties:
            id: { type: string, format: uuid }
            created_at: { type: string, format: date-time }
    Rule:
      type: object
      required: [unlock_minutes, pass_threshold, subject_weight, daily_limit]
      properties:
        unlock_minutes: { type: integer, example: 20 }
        pass_threshold: { type: number, format: double, example: 3 }
        subject_weight:
          type: object
          additionalProperties: { type: number }
          example: { math: 2, chinese: 1, science: 1, fun: 0.5 }
        fun_ratio_cap: { type: integer, example: 2 }
        fun_enabled: { type: boolean }
        weight_preset: { type: string, enum: [balanced, math, literacy, custom] }
        daily_limit: { type: integer, example: 60 }
        offline_fallback_min: { type: integer, example: 10 }
        scope_mode: { type: string, enum: [media, custom, all_apps] }
        allowed_apps:
          type: array
          items: { type: string }
        timezone: { type: string, example: Asia/Shanghai }
        time_window:
          type: object
          properties:
            allow:
              type: array
              items:
                type: object
                properties:
                  start: { type: string, example: "07:00" }
                  end: { type: string, example: "21:00" }
    LoginResult:
      type: object
      properties:
        account: { $ref: "#/components/schemas/Account" }
        access_token: { type: string }
        refresh_token: { type: string }
        expires_in: { type: integer }
        expires_at: { type: string, format: date-time }
    QuestionInput:
      type: object
      required: [subject, category, stage, difficulty, type, stem, answer]
      properties:
        subject: { type: string, example: math }
        category: { type: string, enum: [core, literacy, topic, fun] }
        stage: { type: string, enum: [preschool, low, mid, high] }
        grade_tag: { type: string, example: g2 }
        difficulty: { type: integer, minimum: 1, maximum: 5 }
        type: { type: string, enum: [choice, voice, image, fill, sort, match] }
        stem: { type: string }
        stem_media: {}
        options: {}
        answer: {}
        answer_alias: {}
        explain: { type: string }
        duration_limit: { type: integer }
        topic_id: { type: string, format: uuid }
        schema_ver: { type: integer }
