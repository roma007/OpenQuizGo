        content:
          application/json:
            schema:
              type: object
              properties:
                approve: { type: boolean }
      responses:
        "200": { description: OK }
  /v1/admin/questions/{id}/publish:
    post:
      tags: [admin]
      summary: 题目上线
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: OK }
  /v1/admin/questions/{id}/offline:
    post:
      tags: [admin]
      summary: 题目下线
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
