openapi: 3.0.3
info:
  title: OpenQuizGo API
  version: 0.1.0
  description: |
    答题解锁电视使用时长的服务端 API。第一期覆盖服务端全部能力：
    身份/家庭/设备、题库治理、组卷、答题判分、规则引擎、授权计量、
    离线租约、成长报告与可观测性端点。

    鉴权方式均为 `Authorization: Bearer <token>`，但令牌类型不同：
    - 家长令牌：`/auth/login` 获取，访问 `/family/*`
    - 设备令牌：`/device/token` 获取，访问 `/quiz/*`、`/watch/*`、`/child/context`
    - 管理员令牌：`/admin/auth/login` 获取，访问 `/admin/*`
servers:
  - url: http://localhost:8080
    description: 本地开发
tags:
  - name: auth
  - name: family
  - name: device
  - name: quiz
  - name: watch
  - name: report
  - name: daily
  - name: topic
  - name: membership
  - name: battle
  - name: dashboard
  - name: payment
  - name: admin
  - name: system
paths:
  /healthz:
    get:
      tags: [system]
      summary: 存活探针
      security: []
      responses:
        "200": { description: OK }
  /readyz:
    get:
      tags: [system]
      summary: 就绪探针（数据库/Redis）
      security: []
      responses:
        "200": { description: Ready }
        "503": { description: Not ready }
  /metrics:
    get:
      tags: [system]
      summary: Prometheus 指标
      security: []
      responses:
        "200": { description: Prometheus text format }
  /v1/meta:
    get:
      tags: [system]
      summary: 服务元信息
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  service: { type: string }
                  version: { type: string }
                  env: { type: string }

  /v1/auth/sms/code:
    post:
      tags: [auth]
      summary: 发送登录验证码（mock 模式固定 123456）
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone: { type: string, example: "13800138000" }
      responses:
        "200": { description: 已发送 }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/auth/login:
    post:
      tags: [auth]
      summary: 手机号 + 验证码登录（首登自动创建家庭）
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, code]
              properties:
                phone: { type: string }
                code: { type: string }
      responses:
        "200":
          description: 登录成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/auth/refresh:
    post:
      tags: [auth]
      summary: 轮换刷新令牌
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token: { type: string }
      responses:
        "200":
          description: 新令牌
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResult" }
  /v1/auth/logout:
    post:
      tags: [auth]
      summary: 吊销刷新令牌
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token: { type: string }
      responses:
        "200": { description: OK }

  /v1/family/me:
    get:
      tags: [family]
      summary: 当前家长账号
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
  /v1/family/children:
    get:
      tags: [family]
      summary: 孩子列表
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Child" }
    post:
      tags: [family]
      summary: 新增孩子（自动创建默认规则）
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChildInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Child" }
  /v1/family/children/{childID}:
    parameters:
      - $ref: "#/components/parameters/ChildID"
    get:
      tags: [family]
      summary: 孩子详情
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Child" }
    put:
      tags: [family]
      summary: 更新孩子档案
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChildInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Child" }
  /v1/family/pin:
    post:
      tags: [family]
      summary: 设置/修改家长 PIN
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                current_pin: { type: string }
                new_pin: { type: string }
      responses:
        "200": { description: OK }
  /v1/family/pin/verify:
    post:
      tags: [family]
      summary: 校验家长 PIN
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                pin: { type: string }
      responses:
        "200": { description: OK }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v1/family/members:
    get:
      tags: [family]
      summary: 家庭成员（手机号脱敏）
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: OK }
  /v1/family/members/invite:
    post:
      tags: [family]
      summary: 生成家庭邀请码
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: OK }
  /v1/family/members/join:
    post:
      tags: [family]
      summary: 使用邀请码加入家庭
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                code: { type: string }
      responses:
        "200": { description: OK }
  /v1/family/children/{childID}/rule:
    parameters:
      - $ref: "#/components/parameters/ChildID"
    get:
      tags: [family]
      summary: 读取孩子规则
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  rule: { $ref: "#/components/schemas/Rule" }
                  version: { type: integer }
    put:
      tags: [family]
      summary: 更新规则（需 PIN）
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pin, rule]
              properties:
                pin: { type: string }
                rule: { $ref: "#/components/schemas/Rule" }
      responses:
        "200": { description: OK }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /v1/family/children/{childID}/rule/preview:
    parameters:
      - $ref: "#/components/parameters/ChildID"
    post:
      tags: [family]
      summary: 规则 dry-run（题量/配额/最高加权分）
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                rule: { $ref: "#/components/schemas/Rule" }
      responses:
        "200": { description: OK }

  /v1/family/devices:
    get:
      tags: [device]
      summary: 已绑定设备
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: OK }
  /v1/family/devices/activate:
    post:
      tags: [device]
      summary: 家长凭激活码绑定孩子
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [code, child_id]
              properties:
                code: { type: string }
                child_id: { type: string, format: uuid }
      responses:
        "200": { description: OK }
  /v1/family/devices/{deviceID}:
    delete:
      tags: [device]
      summary: 解绑设备（令牌立即失效）
      security: [{ bearerAuth: [] }]
      parameters:
        - name: deviceID
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: OK }
  /v1/family/devices/{deviceID}/unlock:
    post:
      tags: [device]
      summary: 家长远程解锁（签发观看时间）
      description: 校验家长 PIN、设备归属与每日额度后签发授权；忽略观看时段限制。
      security: [{ bearerAuth: [] }]
      parameters:
        - name: deviceID
          in: path
          required: true
          description: 设备绑定 ID（GET /family/devices 返回的 id）
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pin]
              properties:
                pin: { type: string, example: "1234" }
                minutes: { type: integer, minimum: 5, maximum: 60, default: 10 }
      responses:
        "200":
          description: 已签发的授权
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Grant" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: 设备不存在或不属于本家庭 }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/family/children/{childID}/reports:
    parameters:
      - $ref: "#/components/parameters/ChildID"
    get:
      tags: [report]
      summary: 周/月成长报告
      security: [{ bearerAuth: [] }]
      parameters:
        - name: period
          in: query
          schema: { type: string, enum: [week, month], default: week }
        - name: limit
          in: query
          schema: { type: integer, default: 8 }
      responses:
        "200": { description: OK }

  /v1/family/alerts:
    get:
      tags: [alert]
      summary: 家庭告警列表
      security: [{ ParentAuth: [] }]
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
      responses:
        "200":
          description: 告警与未读数
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AlertList" }

  /v1/family/alerts/read:
    post:
      tags: [alert]
      summary: 标记全部告警已读
      security: [{ ParentAuth: [] }]
      responses:
        "200": { description: OK }

  /v1/family/children/{childID}/daily:
    parameters:
      - $ref: "#/components/parameters/ChildID"
    get:
      tags: [daily]
      summary: 每日一题状态
      description: 返回当天题目、作答状态与连续打卡统计。
      security: [{ ParentAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DailyState" }
        "404": { description: 孩子不存在 }
        "409": { description: 题库暂无可用题目 }
  /v1/family/children/{childID}/daily/answers:
    parameters:
      - $ref: "#/components/parameters/ChildID"
    post:
      tags: [daily]
      summary: 提交每日一题答案
      description: 每日仅记录首次作答，重复提交返回当前状态。
      security: [{ ParentAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [answer]
              properties:
                answer: {}
      responses:
        "200":
          description: 判分后的状态
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DailyState" }
        "404": { description: 孩子不存在 }
        "422": { $ref: "#/components/responses/ValidationError" }

  /v1/family/battles/ranking:
    get:
      tags: [battle]
      summary: 家庭对战排行榜
      security: [{ ParentAuth: [] }]
      parameters:
        - name: period
          in: query
          schema: { type: string, enum: [all, week, month], default: all }
      responses:
        "200":
          description: 家庭内孩子排名
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/BattleRankingEntry" }

  /v1/family/children/{childID}/battles:
    parameters:
      - $ref: "#/components/parameters/ChildID"
    get:
      tags: [battle]
      summary: 亲子对战历史
      security: [{ ParentAuth: [] }]
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 20, maximum: 50 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/BattleSummary" }
    post:
      tags: [battle]
      summary: 发起亲子对战
      description: same_device 直接开始；room 模式返回 6 位房间码等待加入，房间码 10 分钟内有效。
      security: [{ ParentAuth: [] }]
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BattleCreateRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BattleState" }
        "409": { description: 题库可用题目不足 }
        "422": { $ref: "#/components/responses/ValidationError" }
  /v1/family/children/{childID}/battles/join:
    parameters:
      - $ref: "#/components/parameters/ChildID"
    post:
      tags: [battle]
      summary: 凭房间码加入对战
      security: [{ ParentAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BattleJoinRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BattleState" }
        "404": { description: 房间不存在或已失效 }
        "422": { $ref: "#/components/responses/ValidationError" }
  /v1/family/children/{childID}/battles/{battleID}:
    parameters:
      - $ref: "#/components/parameters/ChildID"
      - { name: battleID, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [battle]
      summary: 对战状态
      description: 未结束时不下发正确答案与解析。
      security: [{ ParentAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BattleState" }
        "404": { description: 对局不存在 }
  /v1/family/children/{childID}/battles/{battleID}/events:
    parameters:
      - $ref: "#/components/parameters/ChildID"
      - { name: battleID, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [battle]
      summary: 对战事件流（SSE）
      description: "初始与状态变更时发送 event: update；每 20 秒发送心跳。"
      security: [{ ParentAuth: [] }]
      responses:
        "200":
          description: text/event-stream
          content:
            text/event-stream:
              schema: { type: string }

  /v1/family/children/{childID}/battles/{battleID}/answers:
    parameters:
      - $ref: "#/components/parameters/ChildID"
      - { name: battleID, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [battle]
      summary: 提交一方全部答案
      security: [{ ParentAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BattleSubmitRequest" }
      responses:
        "200":
          description: 推进后的对战状态
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BattleState" }
        "404": { description: 对局不存在 }
        "409": { description: 房间未加入或非当前答题轮次 }
        "422": { $ref: "#/components/responses/ValidationError" }

  /v1/family/membership:
    get:
      tags: [membership]
      summary: 会员中心
      description: 当前会员状态与在售套餐。
      security: [{ ParentAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MembershipCenter" }
  /v1/family/membership/orders:
    get:
      tags: [membership]
      summary: 我的订单
      security: [{ ParentAuth: [] }]
      responses:
        "200":
          description: 最近 20 笔订单
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/MembershipOrder" }
    post:
      tags: [membership]
      summary: 创建订单
      security: [{ ParentAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [plan_id]
              properties:
                plan_id: { type: string, format: uuid }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MembershipOrder" }
        "404": { description: 套餐不存在 }
        "409": { description: 套餐未上线 }
  /v1/family/membership/orders/{orderID}/pay:
    parameters:
      - { name: orderID, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [membership]
      summary: 支付订单（mock 渠道即时到账）
      security: [{ ParentAuth: [] }]
      responses:
        "200":
          description: 订单与最新会员状态
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MembershipPayResult" }
        "404": { description: 订单不存在 }
        "409": { description: 订单已取消 }

  /v1/payments/callback:
    post:
      tags: [payment]
      summary: 支付渠道回调
      description: 使用 `X-Payment-Signature`（HMAC-SHA256(原始请求体, 回调密钥) 的十六进制小写）校验；无需登录令牌。
      security: []
      parameters:
        - name: X-Payment-Signature
          in: header
          required: true
          description: HMAC-SHA256 十六进制签名
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PaymentCallbackRequest" }
      responses:
        "200":
          description: 已处理
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  order_no: { type: string }
                  paid: { type: boolean }
        "401": { description: 回调签名无效 }
        "404": { description: 订单不存在 }
        "409": { description: 订单已退款 }
        "422": { $ref: "#/components/responses/ValidationError" }
        "503": { description: 支付回调未启用 }

  /v1/device/activate/code:
    post:
      tags: [device]
      summary: 电视端申请激活码
      security: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [device_id, platform]
              properties:
                device_id: { type: string }
                platform: { type: string, enum: [tv, phone, pad, miniapp] }
      responses:
        "200": { description: OK }
  /v1/device/token:
    post:
      tags: [device]
      summary: 电视端兑换设备令牌
      security: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [code, device_id]
              properties:
                code: { type: string }
                device_id: { type: string }
      responses:
        "200": { description: 已绑定 }
        "202": { description: 等待家长确认 }
  /v1/device/me:
    get:
      tags: [device]
      summary: 设备信息
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: OK }
  /v1/device/capability:
    put:
      tags: [device]
      summary: 上报守护模式与权限状态
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: OK }
  /v1/device/tamper:
    post:
      tags: [device]
      summary: 上报权限关闭/卸载等异常
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: OK }

  /v1/child/context:
    get:
      tags: [device]
      summary: 电视端可看状态
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: OK }
  /v1/quiz/sessions:
    post:
      tags: [quiz]
      summary: 创建答题会话
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: 会话与题目（不含答案）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreateSessionResponse" }
        "409": { description: 已有进行中的会话或题库不足 }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/quiz/sessions/{sessionID}:
    get:
      tags: [quiz]
      summary: 会话状态（断线恢复）
      security: [{ bearerAuth: [] }]
      parameters:
        - name: sessionID
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: OK }
  /v1/quiz/sessions/{sessionID}/answers:
    post:
      tags: [quiz]
      summary: 提交答案（一次性令牌）
      security: [{ bearerAuth: [] }]
      parameters:
        - name: sessionID
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, answer]
              properties:
                token: { type: string }
                answer: {}
      responses:
        "200":
          description: 判分结果
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnswerResult" }
        "409": { description: 令牌已使用/会话结束 }
        "410": { description: 会话过期 }
  /v1/quiz/sessions/{sessionID}/finish:
    post:
      tags: [quiz]
      summary: 结算会话（可能签发授权）
      security: [{ bearerAuth: [] }]
      parameters:
        - name: sessionID
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: 结算结果
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionSummary" }

  /v1/watch/grants/active:
    get:
      tags: [watch]
      summary: 当前有效授权
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: OK }
        "404": { description: 无有效授权 }
  /v1/watch/grants/{grantID}/heartbeat:
    post:
      tags: [watch]
      summary: 心跳计量
      security: [{ bearerAuth: [] }]
      parameters:
        - name: grantID
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                foreground_app: { type: string }
                paused: { type: boolean }
                position_seconds: { type: integer }
      responses:
        "200": { description: 计量结果 }
  /v1/offline/lease:
    get:
      tags: [watch]
      summary: 预签发离线租约（Ed25519）
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: OK }
        "403": { description: 时段/额度不允许 }
  /v1/watch/logs:
    post:
      tags: [watch]
      summary: 离线观看记录对账
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [lease_id, entries]
              properties:
                lease_id: { type: string, format: uuid }
                entries:
                  type: array
                  items:
                    type: object
                    properties:
                      start_at: { type: string, format: date-time }
                      end_at: { type: string, format: date-time }
                      watched_seconds: { type: integer }
                      paused_seconds: { type: integer }
                      target_app: { type: string }
      responses:
        "200": { description: 对账结果 }
        "409": { description: 已对账 }

  /v1/admin/auth/login:
    post:
      tags: [admin]
