name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: openquizgo
          POSTGRES_PASSWORD: openquizgo
          POSTGRES_DB: openquizgo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openquizgo -d openquizgo"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      APP_ENV: ci
      DATABASE_URL: postgres://openquizgo:openquizgo@localhost:5432/openquizgo?sslmode=disable
      REDIS_URL: redis://localhost:6379/0
      TEST_DATABASE_URL: postgres://openquizgo:openquizgo@localhost:5432/openquizgo?sslmode=disable
      TEST_REDIS_URL: redis://localhost:6379/15

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Vet
        run: go vet ./...

      - name: Test
        run: |
          set +e
          go test -p 1 ./... 2>&1 | tee /tmp/test.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            msg=$(tail -n 80 /tmp/test.log | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=go-test-failure::$msg"
          fi
          exit $code

      - name: Migrate
        run: go run ./cmd/migrate up

      - name: Build
        run: go build ./...
