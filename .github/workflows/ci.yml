name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: openquizgo
          POSTGRES_PASSWORD: openquizgo
          POSTGRES_DB: openquizgo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openquizgo -d openquizgo"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      APP_ENV: ci
      DATABASE_URL: postgres://openquizgo:openquizgo@localhost:5432/openquizgo?sslmode=disable
      REDIS_URL: redis://localhost:6379/0
      TEST_DATABASE_URL: postgres://openquizgo:openquizgo@localhost:5432/openquizgo?sslmode=disable
      TEST_REDIS_URL: redis://localhost:6379/15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Migrate
        run: go run ./cmd/migrate up

      - name: Build
        run: go build ./...
