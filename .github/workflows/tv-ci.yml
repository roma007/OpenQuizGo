name: tv-ci

on:
  push:
    branches: [main]
    paths:
      - "tv/**"
      - ".github/workflows/tv-ci.yml"
  pull_request:
    paths:
      - "tv/**"

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: tv
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle network diagnostics
        run: |
          official=$(curl -sSI -o /dev/null -w '%{http_code}' --max-time 30 \
            https://services.gradle.org/distributions/gradle-9.3.1-bin.zip || echo ERR)
          mirror=$(curl -sSI -o /dev/null -w '%{http_code}' --max-time 30 \
            https://mirrors.cloud.tencent.com/gradle/gradle-9.3.1-bin.zip || echo ERR)
          echo "::notice title=gradle-network::official=$official mirror=$mirror java=$(java -version 2>&1 | head -1)"

      # 官方分发包会重定向到 GitHub Releases，偶发 5xx 导致 wrapper 下载失败；
      # 失败后自动切换镜像并重试，避免 CI 被外部 CDN 抖动阻塞。
      - name: Unit tests
        run: |
          # GitHub 默认 bash -e，必须先关闭才能在失败后重试。
          set +e
          set -o pipefail
          for attempt in 1 2 3; do
            echo "Gradle attempt $attempt"
            ./gradlew :app:testDebugUnitTest --no-daemon 2>&1 | tee "/tmp/gradle-$attempt.log"
            code=${PIPESTATUS[0]}
            if [ "$code" -eq 0 ]; then
              exit 0
            fi
            # 单行摘要，避免 % 与换行导致注解解析失败。
            msg=$(tail -n 40 "/tmp/gradle-$attempt.log" | tr '\n' ' ' | tr -s ' ' | cut -c1-1500 | sed 's/%/%25/g')
            echo "::error title=gradle-attempt-$attempt::$msg"
            sed -i 's#services.gradle.org/distributions#mirrors.cloud.tencent.com/gradle#' \
              gradle/wrapper/gradle-wrapper.properties
            sleep 10
          done
          exit 1

      - name: Report Gradle failure
        if: failure()
        run: |
          for f in /tmp/gradle-*.log; do
            echo "### $f"
            tail -n 80 "$f"
          done > /tmp/report.txt
          msg=$(tail -n 120 /tmp/report.txt | tr '\n' ' ' | tr -s ' ' | cut -c1-4000 | sed 's/%/%25/g')
          echo "::error title=gradle-log::$msg"

      - name: Assemble debug
        run: ./gradlew :app:assembleDebug --no-daemon
