plugins {
    id 'com.android.application'
}

android {
    namespace 'com.openquizgo.poc'
    compileSdk 35

    defaultConfig {
        applicationId "com.openquizgo.poc"
        minSdk 26
        targetSdk 33
        versionCode 1
        versionName "0.1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
