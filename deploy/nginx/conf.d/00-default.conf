# 未知 Host / 裸域名兜底
# 目的：备案巡检直接访问裸 IP 或 openapp.asia 时给出可读页面，而不是暴露某个站点；
#      未知 SNI 在 TLS 握手阶段就被拒绝，不返回任何证书与内容。
# 注意：本文件按文件名排序最先加载，独占两个 default_server，其它 conf 只用普通 listen。

# 80：未知 Host 统一跳到官网；openapp.asia / www.openapp.asia 由 www.conf 单独处理
server {
    listen 80 default_server;
    server_name _;
    return 301 https://www.openapp.asia$request_uri;
}

# 443：未知 SNI / 裸 IP 直连一律拒绝握手（nginx ≥ 1.19.4）
server {
    listen 443 ssl default_server;
    ssl_reject_handshake on;
}
