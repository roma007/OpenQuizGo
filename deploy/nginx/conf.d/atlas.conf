# OpenChronicleAtlas 静态站
# 测试期：127.0.0.1:8081（SSH 隧道访问）
# 备案通过后：改成 listen 80 / 443，server_name atlas.openapp.asia
server {
    listen 8081;
    # 只允许本机与 Tailscale 网段（100.64.0.0/10），其余一律拒绝
    allow 127.0.0.1;
    allow 100.64.0.0/10;
    deny  all;
    server_name atlas.openapp.asia;

    root  /srv/atlas;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # 带内容 hash 的资源：一年强缓存
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location /icons/ {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # 搜索索引等数据：1 小时
    location /data/ {
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    # PWA 相关文件必须不缓存，否则更新发不出去
    location = /sw.js                { add_header Cache-Control "no-cache"; }
    location = /manifest.webmanifest { add_header Cache-Control "no-cache"; }
    location = /index.html           { add_header Cache-Control "no-cache"; }

    # SPA 路由回退：/search /privacy /about /atlas/*
    location / {
        try_files $uri $uri/ /index.html;
    }
}
