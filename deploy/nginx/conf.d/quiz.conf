# OpenQuizGo 管理后台 + API
# 2026-11-24 备案通过：80 → 301 到 443；443 对外提供服务（管理面按方案 A 公网可达，
# 靠「12 位以上口令 + qz_auth 按 IP 限流 + Go 侧按用户名锁定」三层防护）；
# 8082 保留为 tailnet 调试口与 scripts/deploy.sh 的自检地址。
# 证书：/srv/nginx/certs/quiz.openapp.asia.{pem,key}（DigiCert DV，2027-02-21 到期，SAN 含 www）

server {
    listen 80;
    server_name quiz.openapp.asia www.quiz.openapp.asia;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name quiz.openapp.asia www.quiz.openapp.asia;

    ssl_certificate     /etc/nginx/certs/quiz.openapp.asia.pem;
    ssl_certificate_key /etc/nginx/certs/quiz.openapp.asia.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:quiz_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    root  /srv/quizgo/admin-web/dist;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'" always;
    # HSTS：2026-11-24 用户确认后开启（不加 preload / includeSubDomains）
    add_header Strict-Transport-Security "max-age=31536000" always;

    # 指标不对公网开放
    location /metrics {
        deny all;
    }

    # 管理端接口：公网可达，按 IP 限流挡撞库（Go 侧另有按用户名 5 次/15 分钟）
    location /v1/admin/ {
        limit_req zone=qz_auth burst=5 nodelay;

        proxy_pass http://127.0.0.1:8080$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # 家长端登录 / 刷新 / 短信验证码：登录类接口单独限流
    location /v1/auth/ {
        limit_req zone=qz_auth burst=5 nodelay;

        proxy_pass http://127.0.0.1:8080$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # 其余 API：按 IP 600 次/分，防刷
    location /v1/ {
        limit_req zone=qz_api burst=120 nodelay;

        proxy_pass http://127.0.0.1:8080$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:8080/healthz;
        access_log off;
    }

    # 带 hash 的资源长缓存
    location /assets/ {
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Cache-Control "no-cache";
    }

    # 管理后台是 SPA，刷新子路由要回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# 调试口：只允许本机与 Tailscale 网段（100.64.0.0/10），其余一律拒绝。
# 保留原因：TLS 配错时这是唯一不依赖证书的验证通道，也是 deploy.sh 的 BASE_URL。
server {
    listen 8082;
    allow 127.0.0.1;
    allow 100.64.0.0/10;
    deny  all;
    server_name quiz.openapp.asia;

    root  /srv/quizgo/admin-web/dist;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'" always;

    location /metrics {
        deny all;
    }

    location /v1/ {
        proxy_pass http://127.0.0.1:8080$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:8080/healthz;
        access_log off;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
