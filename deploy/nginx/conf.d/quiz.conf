# OpenQuizGo 管理后台 + API
# 测试期：127.0.0.1:8082（SSH 隧道访问）
# 备案通过后：改成 listen 80 / 443，server_name quiz.openapp.asia
server {
    listen 8082;
    # 只允许本机与 Tailscale 网段（100.64.0.0/10），其余一律拒绝
    allow 127.0.0.1;
    allow 100.64.0.0/10;
    deny  all;
    server_name quiz.openapp.asia;

    root  /srv/quizgo/admin-web/dist;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'" always;

    # 指标不对公网开放
    location /metrics {
        deny all;
    }

    # API 反代到 quizgo api 容器
    location /v1/ {
        proxy_pass http://127.0.0.1:8080$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:8080/healthz;
        access_log off;
    }

    # 带 hash 的资源长缓存
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # 管理后台是 SPA，刷新子路由要回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
