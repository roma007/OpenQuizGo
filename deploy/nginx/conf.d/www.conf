# OpenApp 官网（openapp.asia / www.openapp.asia）
# 2026-11-25 证书签发后启用：一张双 SAN 证书（openapp.asia + www.openapp.asia）
# 站点产物由 OpenApp 仓库发布到 /srv/www/openapp，当前为占位页
# HSTS 暂不开启：等完成一次证书续期后再评估（见 OpenApp 方案 3.4）

server {
    listen 80;
    server_name openapp.asia www.openapp.asia;

    # 证书验证文件走这里，避免被下面的 301 吃掉
    location ^~ /.well-known/acme-challenge/ {
        root /srv/www/acme;
    }

    location / {
        return 301 https://www.openapp.asia$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name www.openapp.asia;

    ssl_certificate     /etc/nginx/certs/openapp.asia.pem;
    ssl_certificate_key /etc/nginx/certs/openapp.asia.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:www_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    root  /srv/www/openapp;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; object-src 'none'; base-uri 'self'" always;

    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location /images/ {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # 品牌图标与产品 Logo：用 expires 而不是 add_header，避免覆盖 server 级安全头
    location /brand/ {
        expires 7d;
        try_files $uri =404;
    }

    location /media/ {
        expires 7d;
        try_files $uri =404;
    }

    # 安装包与大文件：单连接限速，避免 3Mbps 带宽被一个下载占满
    # limit_rate 200k ≈ 1.6Mbps，给页面留出带宽；前 512k 不限速，小文件不受影响
    # 每 IP 并发连接限制（limit_conn）需要 http 级 zone，见 requests/2026-11-25-openapp-to-quizgo-download-zone.md
    # 本 location 重新声明安全头：location 内一旦有 add_header 就不再继承 server 级
    location ~* ^/downloads/.*\.(apk|zip|7z|exe|dmg|msi|tar\.gz)$ {
        limit_rate_after 512k;
        limit_rate 200k;
        add_header Content-Disposition "attachment";
        add_header Cache-Control "public, max-age=604800";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; object-src 'none'; base-uri 'self'" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}

# 裸域一律 301 到 www（同一张证书）
server {
    listen 443 ssl;
    http2 on;
    server_name openapp.asia;

    ssl_certificate     /etc/nginx/certs/openapp.asia.pem;
    ssl_certificate_key /etc/nginx/certs/openapp.asia.key;
    return 301 https://www.openapp.asia$request_uri;
}
