worker_processes 1;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rt=$request_time';
    access_log /dev/stdout main;

    sendfile           on;
    tcp_nopush         on;
    keepalive_timeout  65;
    server_tokens      off;

    # 3Mbps 带宽下必须开 gzip
    gzip              on;
    gzip_vary         on;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css application/javascript application/json
                      application/manifest+json image/svg+xml application/xml;

    # 题目图片上传上限
    client_max_body_size 8m;

    # 按 IP 限流：管理端登录与登录/刷新接口 10 次/分（突发 5），其余 API 600 次/分（突发 120）
    # 与 Go 侧「按用户名 5 次/15 分钟」互补：前者挡分布式撞库，后者挡单账号爆破
    limit_req_zone     $binary_remote_addr zone=qz_auth:10m rate=10r/m;
    limit_req_zone     $binary_remote_addr zone=qz_api:10m  rate=600r/m;
    limit_req_status   429;
    limit_req_log_level warn;

    # 官网 /downloads/ 的每 IP 并发上限（由 conf.d/www.conf 引用 limit_conn www_dl 2）
    # 需求来源：/srv/ops/requests/2026-11-25-openapp-to-quizgo-download-zone.md
    limit_conn_zone    $binary_remote_addr zone=www_dl:10m;

    include /etc/nginx/conf.d/*.conf;
}
