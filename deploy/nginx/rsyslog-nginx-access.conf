# 接收 nginx 容器（host 网络）发来的 access log，落盘留存（公安联网备案 ≥6 个月）
# 安装：sudo install -m 644 deploy/nginx/rsyslog-nginx-access.conf /etc/rsyslog.d/49-nginx-access.conf
# 装载：sudo systemctl restart rsyslog
# 轮转：/etc/logrotate.d/quizgo-nginx（保留 200 天，压缩）
module(load="imudp")
input(type="imudp" port="514" address="127.0.0.1")

# legacy directive：避免 rsyslog 进程 umask 077 把 0640 降成 0600
$umask 0022

# 原样保留 nginx 的 log_format（不额外加 syslog 前缀）
template(name="nginxAccessRaw" type="string" string="%msg%\n")

if $syslogfacility-text == "local6" then {
    action(
        type="omfile"
        file="/var/log/nginx/access.log"
        template="nginxAccessRaw"
        fileCreateMode="0640"
        dirCreateMode="0750"
        createDirs="on"
    )
    stop
}
