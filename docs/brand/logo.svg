<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="OpenQuizGo">
  <title>OpenQuizGo</title>
  <desc>OpenQuizGo 应用图标：深色底板 + 蓝色外环（缺口在 3 点钟方向）+ 中央亲子图形（大人身前站着小孩）。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1C2732"/>
      <stop offset="1" stop-color="#0E161D"/>
    </linearGradient>
    <linearGradient id="ring" x1="0.1" y1="0.05" x2="0.9" y2="0.95">
      <stop offset="0" stop-color="#7CC4FF"/>
      <stop offset="1" stop-color="#2F6BFF"/>
    </linearGradient>
    <linearGradient id="glyph" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5FE3A0"/>
      <stop offset="1" stop-color="#2BB673"/>
    </linearGradient>
  </defs>

  <!-- 底板：直角满版 -->
  <rect width="1024" height="1024" fill="url(#bg)"/>

  <!-- 外环：缺口开在 3 点钟方向，两端圆头 -->
  <path d="M 732.6 655.2 A 263.0 263.0 0 1 1 732.6 368.8"
        fill="none" stroke="url(#ring)" stroke-width="116" stroke-linecap="round"/>

  <!-- 中心图形：亲子（大人 + 身前的小孩） -->
  <mask id="halo" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024"><rect width="1024" height="1024" fill="#fff"/><g fill="#000" stroke="#000" stroke-width="18"><circle cx="560" cy="514" r="29"/><path d="M 518.0 686 L 518.0 585.12 Q 518.0 551.12 552.0 551.12 L 568.0 551.12 Q 602.0 551.12 602.0 585.12 L 602.0 686 Z"/></g></mask><g fill="url(#glyph)" mask="url(#halo)"><circle cx="484" cy="378" r="46"/><path d="M 421.0 686 L 421.0 470.88 Q 421.0 436.88 455.0 436.88 L 513.0 436.88 Q 547.0 436.88 547.0 470.88 L 547.0 686 Z"/></g><g fill="url(#glyph)"><circle cx="560" cy="514" r="29"/><path d="M 518.0 686 L 518.0 585.12 Q 518.0 551.12 552.0 551.12 L 568.0 551.12 Q 602.0 551.12 602.0 585.12 L 602.0 686 Z"/></g>
</svg>
